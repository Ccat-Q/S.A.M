name: Build and verify S.A.M.
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: sam-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: sam
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sam" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      SAM_DATABASE_URL: postgresql+psycopg://sam:ci-only-password@localhost:5432/sam
      SAM_SIMULATION_ENABLED: 'false'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e '.[test]'
      - run: ruff check src tests
      - run: alembic upgrade head
      - run: pytest -v --junitxml=results.xml
      - name: Export API contract
        run: python -c 'import json; from sam.api import app; open("../docs/openapi.json", "w").write(json.dumps(app.openapi(), indent=2))'
      - uses: docker/setup-buildx-action@v4
      - name: Build cached deployment image
        uses: docker/build-push-action@v7
        with:
          context: server
          load: true
          push: false
          tags: |
            sam-server:${{ github.sha }}
            sam-server:latest
          cache-from: type=gha,scope=sam-server
          cache-to: type=gha,scope=sam-server,mode=max
      - name: Package deployment artifacts
        working-directory: .
        run: |
          mkdir -p artifacts
          docker save sam-server:${GITHUB_SHA} sam-server:latest | gzip -1 > artifacts/sam-server.tar.gz
          cp -r deploy artifacts/deploy
          cp docs/deployment.md artifacts/deploy/README.md
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT
          (cd artifacts && sha256sum sam-server.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-server
          compression-level: 0
          path: |
            artifacts/
            docs/openapi.json
            server/results.xml
  ios-build:
    runs-on: macos-15
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-client
        id: client
      - name: Analyze and verify client
        working-directory: client
        run: |
          flutter analyze
          flutter test --reporter expanded
      - name: Build unsigned device application
        working-directory: client
        run: python3 ../scripts/run_with_deadline.py --seconds 360 flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package and verify unsigned IPA
        run: bash scripts/package_ipa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-client
          compression-level: 0
          path: |
            artifacts/sam-unsigned.ipa
            artifacts/IPA-CONTENTS.txt
            artifacts/IPA-SHA256.txt
            client/lib/
            client/test/
            client/test_driver/
            client/integration_test/
            client/assets/
            client/ios/
            client/android/
            client/pubspec.lock
          if-no-files-found: warn
      - name: Save native compilation cache
        if: always() && steps.client.outputs.xcode-key != '' && steps.client.outputs.xcode-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ steps.client.outputs.xcode-key }}
  ios-integration:
    runs-on: macos-15
    timeout-minutes: 14
    env:
      SAM_DATABASE_URL: postgresql+psycopg://sam:ci-only-password@localhost:5432/sam
      SAM_SIMULATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-client
        id: client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Start isolated integration service
        run: |
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          brew services start postgresql@16
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          for attempt in {1..30}; do pg_isready && break; sleep 1; done
          psql postgres -c "CREATE USER sam WITH PASSWORD 'ci-only-password';"
          createdb -O sam sam
          pip install -e 'server[test]'
          cd server
          alembic upgrade head
          python ../scripts/ci_members.py
          uvicorn sam.api:app --host 127.0.0.1 --port 8000 --no-access-log > ../artifacts/integration-api.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Boot simulator and verify operator journey
        timeout-minutes: 10
        working-directory: client
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID" || true
          python3 ../scripts/run_with_deadline.py --seconds 120 xcrun simctl bootstatus "$DEVICE_ID" -b
          python3 ../scripts/run_with_deadline.py --seconds 360 flutter build ios --simulator --debug --target=integration_test/journey_test.dart --dart-define=SAM_CI=true 2>&1 | tee ../artifacts/ios-simulator-build.log
          python3 ../scripts/run_with_deadline.py --seconds 180 python3 ../scripts/run_ios_journey.py "$DEVICE_ID" 2>&1 | tee ../artifacts/ios-journey.log
      - name: Capture simulator diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p artifacts/screenshots
          python3 scripts/run_with_deadline.py --seconds 15 xcrun simctl io booted screenshot artifacts/screenshots/simulator-final.png
          python3 scripts/run_with_deadline.py --seconds 20 xcrun simctl spawn booted log show --last 3m --style compact --predicate 'process == "Runner"' > artifacts/simulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation
          compression-level: 0
          path: |
            artifacts/screenshots/
            artifacts/integration-api.log
            artifacts/ios-journey.log
            artifacts/ios-simulator-build.log
            artifacts/simulator-startup.log
            artifacts/simulator.log
            client/build/integration_test/
          if-no-files-found: warn
      - name: Save native compilation cache
        if: always() && steps.client.outputs.xcode-key != '' && steps.client.outputs.xcode-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ steps.client.outputs.xcode-key }}
  deadline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce workflow execution budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/actions_deadline.py
