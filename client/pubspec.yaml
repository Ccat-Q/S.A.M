name: sam_client
description: Original industrial AI control console, backed by S.A.M. simulation service.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: 1.3.0
  flutter_secure_storage: 9.2.4
  web_socket_channel: 3.0.3
  uuid: 4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/RobotoMono-OFL.txt
    - assets/fonts/RobotoCondensed-OFL.txt
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed.ttf
